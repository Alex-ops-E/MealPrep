kind = "mobile"
previewPath = "/grocery-agent-mobile/"
title = "Grocery Agent Mobile"
version = "1.0.0"
id = "artifacts/grocery-agent-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/grocery-agent-mobile/" ]
localPort = 19151

[services.development]
run = "pnpm --filter @workspace/grocery-agent-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grocery-agent-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/grocery-agent-mobile", "run", "serve" ]

[services.env]
PORT = "19151"
BASE_PATH = "/grocery-agent-mobile/"
